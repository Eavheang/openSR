[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "opensr-sr1m"
version = "0.1.1"
description = "Sentinel-2 10 m to 1 m RGB super-resolution for points and dates"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Eavheang" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "numpy",
    "pillow",
    "torch",
    "rasterio",
    "shapely",
    "planetary-computer",
    "pystac-client",
    "mlstac",
    "sen2sr",
    "opensr-srgan>=1.1.0",
]

[project.urls]
Homepage = "https://github.com/Eavheang/openSR"
Issues = "https://github.com/Eavheang/openSR/issues"
